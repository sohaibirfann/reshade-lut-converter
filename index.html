<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReShade → Photoshop LUT Converter</title>
    <meta
      name="description"
      content="Convert ReShade PNG LUTs to Photoshop .cube 3D LUTs, entirely in your browser."
    />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <h1>ReShade → Photoshop LUT Converter</h1>
        <p class="sub">
          Drop a ReShade <code>.png</code> LUT and get a Photoshop
          <code>.cube</code> file back. Runs entirely in your browser — nothing
          is uploaded.
        </p>
      </header>

      <div
        id="drop"
        class="drop"
        role="button"
        tabindex="0"
        aria-label="Drop a PNG LUT here or press Enter to browse"
      >
        <p class="drop-title">Drag &amp; drop your LUT here</p>
        <p class="drop-hint">or click to browse · PNG only</p>
        <input id="file" type="file" accept="image/png,.png" hidden />
      </div>

      <p id="message" class="message" role="status" aria-live="polite" hidden></p>

      <section id="result" class="result" hidden>
        <p id="detected" class="detected"></p>

        <div class="previews">
          <figure>
            <figcaption>Your LUT</figcaption>
            <canvas id="lut-thumb" width="180" height="180"></canvas>
          </figure>
          <figure>
            <figcaption>Sample — before</figcaption>
            <canvas id="before" width="256" height="180"></canvas>
          </figure>
          <figure>
            <figcaption>Sample — after</figcaption>
            <canvas id="after" width="256" height="180"></canvas>
          </figure>
        </div>

        <div class="actions">
          <button id="download" type="button">Download .cube</button>
          <button id="reset" type="button" class="ghost">Convert another</button>
        </div>
      </section>

      <footer class="foot">
        <p>100% client-side. Your LUT never leaves your machine.</p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
